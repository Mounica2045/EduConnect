# ==============================================================================
# EduConnect — Spring Boot Application Properties
# Community Service Project (CSP) — Member 2 (Authentication & Security)
# ==============================================================================

spring.application.name=educonnect-backend
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Configuration (Environment variables with sensible defaults)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:educonnect_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# Flyway Database Migration
# ------------------------------------------------------------------------------
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# JWT Security Configuration
# Minimum 256-bit secret key (Base64-compatible for HMAC-SHA256)
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjdXJlLWVkdWNvbm5lY3Qtand0LXNlY3JldC1rZXktZm9yLWNzcDIwMjYtY29sbGVnZS1wb3J0YWw=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# CORS Configuration (Explicitly approved frontend origins)
# ------------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500}

# ------------------------------------------------------------------------------
# Default Accounts Provisioning (Configured safely via Environment Variables)
# ------------------------------------------------------------------------------
app.init.default-accounts=${INIT_DEFAULT_ACCOUNTS:true}
app.init.admin.email=${ADMIN_EMAIL:admin@college.edu}
app.init.admin.password=${ADMIN_PASSWORD:AdminPassword123!}
app.init.admin.name=Prof. Lakshmi Rao (CSP Coordinator)
app.init.admin.department=Computer Science & Engineering
app.init.admin.semester=Faculty / Admin

app.init.student.email=${STUDENT_EMAIL:student@college.edu}
app.init.student.password=${STUDENT_PASSWORD:Password123!}
app.init.student.name=Aarav Sharma
app.init.student.department=Computer Science & Engineering
app.init.student.semester=Semester 6

# ------------------------------------------------------------------------------
# File Upload & Resource Storage Configuration (Member 3)
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${UPLOAD_DIR:uploads/resources}

