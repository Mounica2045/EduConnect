# ==============================================================================
# EduConnect — Standalone Development Profile (Zero MySQL setup needed)
# Runs with an in-memory database and auto-seeds student and admin accounts
# ==============================================================================

spring.application.name=educonnect-backend-dev
server.port=${PORT:8080}

# Standalone In-Memory Database (No external MySQL server required)
spring.datasource.url=jdbc:h2:mem:educonnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Security & CORS
app.jwt.secret=c3VwZXItc2VjdXJlLWVkdWNvbm5lY3Qtand0LXNlY3JldC1rZXktZm9yLWNzcDIwMjYtY29sbGVnZS1wb3J0YWw=
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5500,http://127.0.0.1:5500

# Seed demo accounts and resources automatically
app.init.default-accounts=true
app.upload.dir=uploads/resources
