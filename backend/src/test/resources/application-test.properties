# ==============================================================================
# EduConnect — Spring Boot Test Configuration (Isolated In-Memory H2 DB)
# ==============================================================================

spring.application.name=educonnect-backend-test

# In-memory H2 Database for unit & integration tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Test JWT Settings
app.jwt.secret=dGVzdC1zZWN1cmUtZWR1Y29ubmVjdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdHMtdmFsaWQtMjU2Yml0
app.jwt.expiration-ms=3600000

# CORS settings for tests
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Disable auto-initialization of demo accounts in tests to test in clean isolation
app.init.default-accounts=false

# Test upload directory
app.upload.dir=target/test-uploads

