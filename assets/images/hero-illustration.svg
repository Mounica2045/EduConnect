<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Ambient Background Blobs -->
  <circle cx="270" cy="200" r="160" fill="url(#bgGrad)" opacity="0.6"/>
  <circle cx="420" cy="110" r="70" fill="#99f6e4" opacity="0.3"/>
  <circle cx="100" cy="300" r="80" fill="#bfdbfe" opacity="0.4"/>

  <!-- Back Stacked Card (Lab Manuals / Code) -->
  <g transform="translate(140, 60) rotate(-6)" filter="url(#cardShadow)">
    <rect width="260" height="170" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="20" y="44" width="180" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="20" y="62" width="140" height="10" rx="5" fill="#f1f5f9"/>
    <rect x="20" y="90" width="50" height="24" rx="6" fill="#ecfdf5"/>
    <text x="32" y="106" font-family="sans-serif" font-size="10" font-weight="bold" fill="#059669">LAB</text>
  </g>

  <!-- Middle Stacked Card (Previous Question Papers) -->
  <g transform="translate(190, 100) rotate(4)" filter="url(#cardShadow)">
    <rect width="270" height="180" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="14" fill="#ede9fe"/>
    <path d="M30 36l4 4 8-8" stroke="#7c3aed" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="62" y="28" width="110" height="12" rx="6" fill="#7c3aed" opacity="0.8"/>
    <rect x="62" y="46" width="70" height="8" rx="4" fill="#cbd5e1"/>
    <line x1="24" y1="80" x2="246" y2="80" stroke="#f1f5f9" stroke-width="2"/>
    <rect x="24" y="100" width="160" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="24" y="118" width="120" height="10" rx="5" fill="#e2e8f0"/>
  </g>

  <!-- Front Hero Card (Subject Notes) -->
  <g transform="translate(90, 130)" filter="url(#cardShadow)">
    <rect width="320" height="200" rx="20" fill="url(#cardGrad1)" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Header of card -->
    <rect x="24" y="24" width="90" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="36" y="40" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Subject Notes</text>
    
    <!-- Title & Subject -->
    <text x="24" y="78" font-family="sans-serif" font-size="16" font-weight="800" fill="#0f172a">DBMS Lecture Notes</text>
    <text x="24" y="98" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748b">Semester 4 • Computer Science</text>
    
    <!-- Description lines -->
    <rect x="24" y="118" width="260" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="134" width="220" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="24" y="150" width="180" height="8" rx="4" fill="#e2e8f0"/>

    <!-- Bottom Action Button & File Pill -->
    <g transform="translate(24, 168)">
      <rect width="64" height="20" rx="4" fill="#eff6ff"/>
      <text x="14" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e40af">PDF • 4.2MB</text>
    </g>

    <g transform="translate(200, 164)">
      <rect width="96" height="28" rx="8" fill="url(#blueAccent)"/>
      <text x="18" y="18" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Download</text>
    </g>
  </g>

  <!-- Floating Graduation Cap Badge -->
  <g transform="translate(50, 70)" filter="url(#cardShadow)">
    <circle cx="28" cy="28" r="28" fill="url(#blueAccent)"/>
    <!-- Mortarboard Icon -->
    <path d="M28 16L14 23l14 7 14-7-14-7z" fill="#ffffff"/>
    <path d="M16 26.5v5c0 3 5.4 5.5 12 5.5s12-2.5 12-5.5v-5l-12 5-12-5z" fill="#93c5fd"/>
    <path d="M40 24v7" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="40" cy="32" r="2" fill="#facc15"/>
  </g>

  <!-- Floating Community Verification Badge -->
  <g transform="translate(370, 270)" filter="url(#cardShadow)">
    <rect width="130" height="50" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="26" cy="25" r="14" fill="#ccfbf1"/>
    <path d="M20 25l4 4 8-8" stroke="#0d9488" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="46" y="23" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Verified</text>
    <text x="46" y="37" font-family="sans-serif" font-size="9" font-weight="500" fill="#0d9488">Peer Approved</text>
  </g>
</svg>
